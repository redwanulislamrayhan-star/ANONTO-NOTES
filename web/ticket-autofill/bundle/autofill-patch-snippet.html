    AMS: 'Amsterdam', FCO: 'Rome', MXP: 'Milan', MAD: 'Madrid', BCN: 'Barcelona',
    JFK: 'New York', EWR: 'Newark', IAD: 'Washington', ORD: 'Chicago',
    LAX: 'Los Angeles', YYZ: 'Toronto', YUL: 'Montreal', SYD: 'Sydney',

  var NATIONALITY = {

    'SAUDI ARABIA': 'Saudi', SAUDI: 'Saudi', KSA: 'Saudi', SAU: 'Saudi',
    INDIA: 'Indian', INDIAN: 'Indian', IND: 'Indian',
    PAKISTAN: 'Pakistani', PAKISTANI: 'Pakistani', PAK: 'Pakistani',
    NEPAL: 'Nepali', NEPALI: 'Nepali', NEPALESE: 'Nepali',
    'SRI LANKA': 'Sri Lankan', 'SRI LANKAN': 'Sri Lankan',
    PHILIPPINES: 'Filipino', FILIPINO: 'Filipino',
    EGYPT: 'Egyptian', EGYPTIAN: 'Egyptian',
    INDONESIA: 'Indonesian', MALAYSIA: 'Malaysian', MYANMAR: 'Myanmar',
    'UNITED KINGDOM': 'British', BRITISH: 'British',
    'UNITED STATES': 'American', AMERICAN: 'American'
  };

  var TITLES = ['MR', 'MRS', 'MS', 'MISS', 'MSTR', 'MASTER', 'DR', 'PROF', 'INF', 'CHD'];

  var STATUS_MAP = {
    OK: 'Confirmed', HK: 'Confirmed', CONFIRMED: 'Confirmed', CONFIRM: 'Confirmed',
    RR: 'Reconfirmed', TK: 'Confirmed', HL: 'Waitlisted', WL: 'Waitlisted',
    WAITLIST: 'Waitlisted', WAITLISTED: 'Waitlisted', RQ: 'On Request',
    PENDING: 'Pending', XX: 'Cancelled', CANCELLED: 'Cancelled', CANCELED: 'Cancelled',
    FLOWN: 'Flown', USED: 'Used', OPEN: 'Open'
  };

  var BENGALI_DIGITS = '০১২৩৪৫৬৭৮৯';

  /* ------------------------------------------------------------------ *
   * Small helpers
   * ------------------------------------------------------------------ */

  function toAsciiDigits(s) {
    return String(s).replace(/[০-৯]/g, function (d) { return String(BENGALI_DIGITS.indexOf(d)); });

  function normalizeText(raw) {
    return toAsciiDigits(String(raw || ''))
      .replace(/\r\n?/g, '\n')
      .replace(/[\u00a0\u2007\u202f]/g, ' ')          // nbsp family
      .replace(/[\u2010-\u2015\u2212]/g, '-')          // dashes
      .replace(/[\u2018\u2019]/g, "'")
      .replace(/[\u201c\u201d]/g, '"')
      .replace(/[\u2192\u21d2\u27a1\u2794]/g, '->')    // arrows

      .replace(/[ ]*\n[ ]*/g, '\n')
      .replace(/\n{3,}/g, '\n\n')

  }

  function toLines(text) {
    return text.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
  }

  function titleCase(s) {
    return String(s).toLowerCase().replace(/\b([a-z])/g, function (m, c) { return c.toUpperCase(); });
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function isLabelLine(line) {
    return /^[A-Za-z][A-Za-z .\/#&()'-]{1,38}\s*:/.test(line);
  }

  var INLINE_LABELS = '(?:TKT|E-?TICKET|TICKET(?:\\s*(?:NO|NUMBER))?|PNR|PASSPORT(?:\\s*(?:NO|NUMBER))?|SEAT|CLASS|CABIN|STATUS|DATE|TIME|DEP|ARR|FROM|TO|FLIGHT(?:\\s*NO)?|NATIONALITY|BAGGAGE|FARE|TOTAL|GATE|TERMINAL|BOOKING\\s*[A-Z]*)';

   * ------------------------------------------------------------------ */

    MONEY_RE_CODE_FIRST.lastIndex = 0;

    while ((m = MONEY_RE_CODE_LAST.exec(text))) {

    while ((m = MONEY_RE_SYMBOL.exec(text))) {

      totalAmount: best.amount,

  function buildDate(parts, fallbackYear) {
    if (!parts || !parts.mo || !parts.d) return null;
    if (parts.mo < 1 || parts.mo > 12 || parts.d < 1 || parts.d > 31) return null;
    var y = parts.y;

      day: parts.d, month: parts.mo, year: y,
      text: pad2(parts.d) + ' ' + MONTH_NAMES[parts.mo] + ' ' + y,
      iso: y + '-' + pad2(parts.mo) + '-' + pad2(parts.d)

  /** All dates inside a (money-masked) string, in order of appearance. */

    var hits = [];
    DATE_PATTERNS.forEach(function (p, pi) {
      p.re.lastIndex = 0;

      while ((m = p.re.exec(str))) {

        if (d) hits.push({ date: d, start: m.index, end: m.index + m[0].length, rank: pi });
      }

    hits.sort(function (a, b) { return a.start - b.start || a.rank - b.rank; });
    var kept = [];
    hits.forEach(function (h) {
      if (!kept.some(function (k) { return h.start < k.end && k.start < h.end; })) kept.push(h);
    });
    return kept;
  }

  function firstDate(str, fallbackYear) {
    var d = findDates(str, fallbackYear);
    return d.length ? d[0].date : null;
  }

  /* ------------------------------------------------------------------ *
   * Times
   * ------------------------------------------------------------------ */

  var TIME_RE = /\b([01]?\d|2[0-3])\s*[:.]\s*([0-5]\d)\s*(AM|PM|A\.M\.|P\.M\.)?\b/gi;
  var TIME_HHMM_RE = /\b([01]\d|2[0-3])([0-5]\d)\s*(?:HRS|HOURS|H)\b/gi;
  var TIME_BARE_RE = /\b([01]\d|2[0-3])([0-5]\d)\b/g;

  function overlaps(list, m) {
    var s = m.index, e = m.index + m[0].length;
    return list.some(function (o) { return s < o.end && o.start < e; });
  }

    var out = [], m;
    TIME_RE.lastIndex = 0;
    while ((m = TIME_RE.exec(str))) {
      var h = +m[1], mi = +m[2], ap = (m[3] || '').toUpperCase().replace(/\./g, '');

      if (ap === 'AM' && h === 12) h = 0;
      out.push({ text: pad2(h) + ':' + pad2(mi), start: m.index, end: m.index + m[0].length });
    }
    TIME_HHMM_RE.lastIndex = 0;
    while ((m = TIME_HHMM_RE.exec(str))) {
      if (!overlaps(out, m)) out.push({ text: m[1] + ':' + m[2], start: m.index, end: m.index + m[0].length });
    }
    if (allowBare) {
      // Bare GDS times ("0310 0730"). Only safe once dates/flights/money are masked.
      TIME_BARE_RE.lastIndex = 0;
      while ((m = TIME_BARE_RE.exec(str))) {
        if (!overlaps(out, m)) out.push({ text: m[1] + ':' + m[2], start: m.index, end: m.index + m[0].length });
      }
    }
    out.sort(function (a, b) { return a.start - b.start; });
    return out;

   * Flight numbers
   * ------------------------------------------------------------------ */

  var FLIGHT_RE = /\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?-?\s?(\d{1,4})([A-Z]?)\b/g;

  function findFlights(str) {
    var out = [], m;
    FLIGHT_RE.lastIndex = 0;
    while ((m = FLIGHT_RE.exec(str))) {
      var code = m[1].toUpperCase(), num = m[2];
      if (FLIGHT_BLACKLIST[code]) continue;
      if (CURRENCY_CODES[code]) continue;                   // TK 2390 on a fare line etc.
      if (num.length < 2 && !AIRLINES[code]) continue;      // too weak
      var before = str.slice(Math.max(0, m.index - 14), m.index).toUpperCase();
      var after = str.slice(m.index + m[0].length, m.index + m[0].length + 6).toUpperCase();
      if (/[৳₹$€£﷼]\s*$/.test(before)) continue;             // money symbol in front
      if (/(TOTAL|FARE|AMOUNT|PRICE|TAX|PAID|CHARGE)\s*:?\s*$/.test(before)) continue;
      if (/(PNR|BOOKING|RESERVATION|LOCATOR|CONFIRMATION|REF(ERENCE)?|SEAT|GATE)[^A-Z0-9]{0,10}$/.test(before)) continue;

      if (AIRLINES[code]) score += 50;
      if (/(FLIGHT|FLT|FL\s*NO|CARRIER)[^A-Z0-9]{0,12}$/.test(before)) score += 40;

  /* ------------------------------------------------------------------ *
   * Airports & routes
   * ------------------------------------------------------------------ */

  var CITY_CODE_RE = /([A-Za-z][A-Za-z .'-]{1,24}?)\s*\(\s*([A-Z]{3})\s*\)/g;
  var BARE_CODE_RE = /\b([A-Z]{3})\b/g;

  function airportLabel(a) {
    if (!a) return '';

  /* ------------------------------------------------------------------ *
   * Segment extraction
   * ------------------------------------------------------------------ */

  function blankSpans(str, spans) {
    var chars = str.split('');
    spans.forEach(function (sp) {
      for (var i = sp.start; i < sp.end && i < chars.length; i++) if (chars[i] !== '\n') chars[i] = ' ';

  function normalizeStatus(str) {
    var up = (str || '').toUpperCase();
    var m = up.match(/\b(CONFIRMED|CONFIRM|WAITLISTED|WAITLIST|CANCELLED|CANCELED|PENDING|FLOWN|USED|OPEN|OK|HK\d*|RR|HL|WL|RQ|XX)\b/);

    var key = m[1].replace(/\d+$/, '');
    return STATUS_MAP[key] || titleCase(m[1]);
  }

  function findCabin(str) {
    var up = (str || '').toUpperCase();
    if (/\bFIRST\s*CLASS\b/.test(up)) return 'First';
    if (/\bBUSINESS\b/.test(up)) return 'Business';
    if (/\bPREMIUM\s*ECONOMY\b/.test(up)) return 'Premium Economy';
    if (/\bECONOMY\b|\bECO\b|\bCOACH\b/.test(up)) return 'Economy';

  }

  function findBaggage(str) {
    var m = str.match(/\b(\d)\s*[xX*]\s*(\d{2})\s*(KGS?|KILOS?)\b/i);
    if (m) return m[1] + ' x ' + m[2] + ' Kg';
    m = str.match(/\b(\d{2,3})\s*(KGS?|KILOS?)\b/i);
    if (m) return m[1] + ' Kg';
    m = str.match(/\b(\d)\s*(PCS?|PIECES?)\b/i);

  }

  function findTerminal(str) {
    var m = str.match(/\bTERMINAL\s*[:#]?\s*([A-Z0-9]{1,3})\b/i);
    return m ? m[1].toUpperCase() : '';
  }

  /**
   * Builds one segment per flight number found. The text window for a segment
   * spans from its flight line to just before the next flight line, so values
   * never bleed between SV804 and SV807.
   */
  function extractSegments(maskedText, fallbackYear) {
    var lines = maskedText.split('\n');
    var lineInfo = [], pos = 0;
    lines.forEach(function (l, i) { lineInfo.push({ i: i, text: l, start: pos }); pos += l.length + 1; });

    if (!flights.length) return [];

    // keep the strongest flight hit per line

      for (var i = 0; i < lineInfo.length; i++) if (lineInfo[i].start <= f.start) li = i;
      if (!byLine[li] || byLine[li].score < f.score) byLine[li] = f;
    });
    var flightLines = Object.keys(byLine).map(Number).sort(function (a, b) { return a - b; });

    var segments = [];

      var nextLi = idx + 1 < flightLines.length ? flightLines[idx + 1] : lines.length;

        var prev = lines[li - up];
        if (!prev) break;
        if (flightLines.indexOf(li - up) >= 0) break;

      var times = findTimes(timeSrc, true);

      var dep = airports[0] || null;
      var arr = airports.length > 1 ? airports[1] : null;
      // explicit "From:"/"To:" labels win over positional guesses
      var wl = window.split('\n');
      wl.forEach(function (l) {
        var mf = l.match(/\b(FROM|DEPARTURE|DEPART(?:URE)?\s*(?:CITY|AIRPORT)?|ORIGIN)\b\s*[:\-]?\s*(.+)$/i);
        if (mf) { var a = findAirports(mf[2]); if (a.length) dep = a[0]; }
        var mt = l.match(/\b(TO|ARRIVAL|ARRIVE|DESTINATION)\b\s*[:\-]?\s*(.+)$/i);
        if (mt) { var b = findAirports(mt[2]); if (b.length) arr = b[0]; }
      });

      segments.push({
        index: segments.length + 1,
        flightNo: f.text,
        airline: AIRLINES[f.code] || '',
        airlineCode: f.code,
        date: dates[0] ? dates[0].date.text : '',
        dateIso: dates[0] ? dates[0].date.iso : '',
        departureTime: times[0] ? times[0].text : '',
        arrivalTime: times[1] ? times[1].text : '',
        arrivalDate: dates[1] ? dates[1].date.text : '',
        status: normalizeStatus(window) || 'Confirmed',
        cabin: findCabin(window),
        from: dep ? airportLabel(dep) : '',
        fromCode: dep ? dep.code : '',
        to: arr ? airportLabel(arr) : '',
        toCode: arr ? arr.code : '',
        route: dep && arr ? airportLabel(dep) + ' → ' + airportLabel(arr) : '',
        baggage: findBaggage(window),
        terminal: findTerminal(window),
        rawWindow: window
      });
    });

    // Fill missing years: assume chronological order across legs
    for (var i = 1; i < segments.length; i++) {
      if (!segments[i].date && segments[i - 1].date) segments[i].date = '';
    }
    return segments;
  }

  /* ------------------------------------------------------------------ *
   * Identity fields
   * ------------------------------------------------------------------ */

  function cleanTitle(t) {
    var up = (t || '').toUpperCase().replace(/\./g, '');
    if (up === 'MASTER') up = 'MSTR';
    return up ? up + '.' : '';
  }

  function normalizeName(raw) {
    if (!raw) return '';
    var s = raw.replace(/\s+/g, ' ').trim().replace(/[.,;]+$/, '');
    s = s.replace(/\b(ADT|CHD|INF|ADULT|CHILD|INFANT)\b/gi, '').trim();
    var title = '';
    var titleRe = new RegExp('\\b(' + TITLES.join('|') + ')\\b\\.?', 'i');
    var tm = s.match(titleRe);

    s = s.replace(/\s+/g, ' ').replace(/^[\/\-,\s]+|[\/\-,\s]+$/g, '');

    if (s.indexOf('/') >= 0) {

      // GDS order is SURNAME/GIVEN NAMES -> display "Given Surname"
      name = titleCase((parts[1] || '') + ' ' + (parts[0] || '')).trim();

  function findPassengerName(lines, maskedText) {
    var hit = grabLabel(lines, /\b(PASSENGER\s*NAME|NAME\s*OF\s*PASSENGER|PASSENGER|TRAVELLER|TRAVELER|PAX\s*NAME|NAME)\b/i);

    m = maskedText.match(/\b(MR|MRS|MS|MSTR|MISS|DR)\.?\s+([A-Z][A-Za-z'-]+(?:\s+[A-Z][A-Za-z'-]+){0,3})/);

  function findNationality(lines, maskedText) {

      return !/AIRLIN|AIRWAYS|AIRPORT|TERMINAL|AVIATION|\bAIR\b/i.test(l);

  function findBookingRef(lines, maskedText) {
    var hit = grabLabel(lines, /\b(BOOKING\s*(REF(?:ERENCE)?|CODE|ID)|PNR(?:\s*(NO|CODE|NUMBER))?|RESERVATION\s*(CODE|NUMBER|REF)|RECORD\s*LOCATOR|AIRLINE\s*REF(?:ERENCE)?|CONFIRMATION\s*(NO|NUMBER|CODE))\b/i, {

  }

  function findTicketNumber(lines, maskedText) {
    var hit = grabLabel(lines, /\b(E?-?\s*TICKET\s*(NO|NUMBER|#)?|TKT\s*(NO|NUMBER)?|DOCUMENT\s*NUMBER)\b/i, {
      test: function (v) { return /\d{6,}/.test(v.replace(/[^\d]/g, '')) || /\d{3}\s*-\s*\d{10}/.test(v); }
    });

    var m = src.match(/\b(\d{3})\s*-?\s*(\d{10})\b/);
    if (m) return m[1] + '-' + m[2];
    m = src.match(/\b(\d{13})\b/);
    if (m) return m[1].slice(0, 3) + '-' + m[1].slice(3);
    if (hit) {
      var any = hit.value.match(/\b([0-9][0-9\- ]{8,18}[0-9])\b/);

    return '';
  }

  function findIssueDate(lines, fallbackYear) {
    var hit = grabLabel(lines, /\b(ISSUE\s*DATE|DATE\s*OF\s*ISSUE|ISSUED\s*(ON|DATE)|BOOKING\s*DATE)\b/i, {
      test: function (v) { return !!firstDate(v, fallbackYear); }

    if (!hit) return '';
    var d = firstDate(hit.value, fallbackYear);
    return d ? d.text : '';
  }

  function findAirline(lines, segments, maskedText) {
    var hit = grabLabel(lines, /\b(AIRLINE|CARRIER|OPERATED\s*BY|OPERATING\s*CARRIER)\b/i);
    if (hit && /[A-Za-z]{3}/.test(hit.value)) return hit.value.replace(/\s*\([A-Z0-9]{2}\)\s*$/, '').trim();
    if (segments.length && segments[0].airline) return segments[0].airline;
    var names = Object.keys(AIRLINES).map(function (k) { return AIRLINES[k]; });
    for (var i = 0; i < names.length; i++) {

  function findBaggageOverall(lines, segments, maskedText) {
    var hit = grabLabel(lines, /\b(BAGGAGE(\s*(ALLOWANCE|INFO))?|FREE\s*BAGGAGE|CHECKED\s*BAGGAGE|LUGGAGE)\b/i);

   * Public API
   * ------------------------------------------------------------------ */

  function parseTicket(rawText, options) {

    // 1) money first, then blank it out everywhere else -> "SAR 2390" can never

    var money = findMoney(text);

    var masked = maskMoney(text, money);

    result.passportNo = findPassport(lines, masked);

    result.bookingReference = findBookingRef(lines, masked);
    result.ticketNumber = findTicketNumber(lines, masked);
    result.issueDate = findIssueDate(lines, fallbackYear);
    result.airline = findAirline(lines, segments, masked);

    // 4) money fields
    result.currency = fare.currency || '';
    result.totalAmount = fare.totalAmount != null ? fare.totalAmount : null;
    result.totalAmountText = fare.totalAmountText || '';
    result.baseFare = fare.baseFare || '';
    result.taxes = fare.taxes || '';
    result.allAmounts = money.map(function (m) { return m.currency + ' ' + formatAmount(m.amount); });

    // 5) itinerary summary
    result.segments = segments.map(function (s) { delete s.rawWindow; return s; });
    if (segments.length) {
      var first = segments[0], last = segments[segments.length - 1];
      result.origin = first.from;
      result.destination = (last.toCode && last.toCode === first.fromCode) ? first.to : (last.to || first.to);
      result.travelDate = first.date;
      result.returnDate = segments.length > 1 ? last.date : '';
      result.tripType = (last.toCode && last.toCode === first.fromCode) ? 'Round Trip' : (segments.length > 1 ? 'Multi City' : 'One Way');
      result.flightNo = first.flightNo;
      result.route = first.route;
    }

    // Destination fallback from an explicit label
    if (!result.destination) {
      var dh = grabLabel(lines, /\b(DESTINATION|GOING\s*TO|ARRIVAL\s*CITY)\b/i);
      if (dh) { var ap = findAirports(dh.value); result.destination = ap.length ? airportLabel(ap[0]) : titleCase(dh.value); }
    }
    if (!result.travelDate) {
      var th = grabLabel(lines, /\b(TRAVEL\s*DATE|DEPARTURE\s*DATE|DATE\s*OF\s*(TRAVEL|JOURNEY|DEPARTURE)|FLIGHT\s*DATE)\b/i);
      if (th) { var td = firstDate(th.value, fallbackYear); if (td) result.travelDate = td.text; }
    }

    result.warnings = buildWarnings(result);
    result.missingFields = REQUIRED_FIELDS.filter(function (f) { return !result[f.key]; }).map(function (f) { return f.label; });
    return result;
  }

  var REQUIRED_FIELDS = [
    { key: 'passengerName', label: 'Passenger Name' },
    { key: 'passportNo', label: 'Passport No.' },
    { key: 'travelDate', label: 'Travel Date' },
    { key: 'destination', label: 'Destination' }

  function buildWarnings(r) {
    var w = [];
    if (!r.segments.length) w.push('No flight segment detected — check that the OCR text contains flight numbers.');
    r.segments.forEach(function (s) {
      if (!s.date) w.push('Flight ' + s.flightNo + ': date not found.');
      if (!s.route) w.push('Flight ' + s.flightNo + ': route not found.');
    });
    if (r.totalAmount == null) w.push('No fare/total amount detected.');
    return w;
  }

  function emptyResult() {
    return {
      passengerName: '', passportNo: '', nationality: '', airline: '',
      bookingReference: '', ticketNumber: '', issueDate: '',
      origin: '', destination: '', travelDate: '', returnDate: '',
      tripType: '', flightNo: '', route: '', cabin: '', baggage: '',
      currency: '', totalAmount: null, totalAmountText: '', baseFare: '', taxes: '',
      allAmounts: [], segments: [], warnings: [], missingFields: [], rawText: ''

  }

  return {
    parseTicket: parseTicket,
    // exposed for tests / reuse
    normalizeText: normalizeText,
    normalizeName: normalizeName,
    findMoney: findMoney,
    maskMoney: maskMoney,
    findDates: findDates,
    findTimes: findTimes,
    findFlights: findFlights,
    findAirports: findAirports,
    formatAmount: formatAmount,
    AIRLINES: AIRLINES,
    AIRPORTS: AIRPORTS
  };
});

    passengerName: {
      must: [/passenger\s*name/, /name\s*of\s*(the\s*)?passenger/, /\bpax\s*name/, /traveller?\s*name/, /যাত্রীর?\s*নাম/, /\bname\b/, /\bনাম\b/],
      boost: [/passenger/, /pax/, /যাত্রী/],
      avoid: [/airline/, /father/, /mother/, /husband/, /sponsor/, /agent/, /company/, /hotel/, /file\s*name/, /user/, /বাবা/, /মা(য়ের)?\s*নাম/, /স্পনসর/]
    },
    passportNo: {
      must: [/passport\s*(no|number|#)?/, /\bpp\s*(no|number)/, /পাসপোর্ট/],
      avoid: [/expiry|expire|issue|valid|date|মেয়াদ/]
    },
    nationality: { must: [/nationality/, /citizenship/, /জাতীয়তা/], avoid: [] },
    destination: { must: [/destination/, /going\s*to/, /arrival\s*city/, /\bto\s*(city|country)/, /গন্তব্য/], avoid: [/from/, /origin/] },
    origin: { must: [/origin/, /departure\s*(city|airport|from)/, /\bfrom\s*(city|airport)/, /যাত্রা\s*শুরু/], avoid: [/destination/] },
    bookingReference: { must: [/booking\s*(ref|reference|code|id)/, /\bpnr\b/, /reservation\s*(code|no|number)/, /record\s*locator/, /confirmation\s*(no|code|number)/, /বুকিং/], avoid: [] },
    ticketNumber: { must: [/e?-?\s*ticket\s*(no|number|#)/, /\btkt\s*(no|number)?/, /document\s*number/, /টিকিট\s*(নম্বর|নং)/], avoid: [/date/] },
    issueDate: { must: [/issue\s*date/, /date\s*of\s*issue/, /issued\s*(on|date)/, /booking\s*date/, /ইস্যু/], avoid: [] },
    airline: { must: [/airlines?\b/, /carrier/, /operated\s*by/, /এয়ারলাইন/, /বিমান\s*সংস্থা/], avoid: [/code/, /name\s*of\s*passenger/] },
    travelDate: { must: [/travel\s*date/, /date\s*of\s*(travel|journey|departure)/, /departure\s*date/, /flight\s*date/, /onward\s*date/, /ভ্রমণ(ের)?\s*তারিখ/, /যাত্রার\s*তারিখ/], avoid: [/return/, /issue/, /expiry/, /birth/, /ফেরার/] },
    returnDate: { must: [/return\s*date/, /date\s*of\s*return/, /inbound\s*date/, /ফেরার\s*তারিখ/], avoid: [] },
    currency: { must: [/currency/, /মুদ্রা/], avoid: [] },
    totalAmountText: { must: [/total\s*(amount|fare|price|paid)/, /grand\s*total/, /amount\s*(paid|total)/, /\btotal\b/, /\bfare\b/, /\bamount\b/, /মোট\s*(টাকা|মূল্য|ভাড়া)/, /ভাড়া/], avoid: [/base/, /tax/, /refund/] },
    baseFare: { must: [/base\s*fare/, /basic\s*fare/, /net\s*fare/, /মূল\s*ভাড়া/], avoid: [] },
    taxes: { must: [/tax(es)?\b/, /surcharge/, /vat\b/, /কর\b/], avoid: [] },
    baggage: { must: [/baggage/, /luggage/, /allowance/, /লাগেজ/, /ব্যাগেজ/], avoid: [] },
    cabin: { must: [/class\b/, /cabin/, /শ্রেণ(ী|ি)/], avoid: [/first\s*name/] }
  };

  // সেগমেন্ট-লেভেল ফিল্ড (Flight 1/2/3 …)
  var SEGMENT_RULES = {
    flightNo: { must: [/flight\s*(no|number|#)/, /\bflt\b/, /\bflight\b/, /ফ্লাইট/], avoid: [/date/, /time/, /status/, /route/] },
    date: { must: [/date/, /তারিখ/], avoid: [/issue/, /birth/, /expiry/, /travel/, /journey/, /return/, /ভ্রমণ/, /ফেরার/] },
    departureTime: { must: [/dep(arture)?\s*time/, /\btime\b/, /\bdep\b/, /সময়/], avoid: [/arr/, /landing/] },
    arrivalTime: { must: [/arr(ival)?\s*time/, /\barr\b/, /landing/, /পৌঁছ/], avoid: [/dep/] },
    status: { must: [/status/, /\bok\b/, /অবস্থা/], avoid: [] },
    route: { must: [/route/, /sector/, /itinerary/, /রুট/], avoid: [] },
    from: { must: [/\bfrom\b/, /origin/, /departure\s*(city|airport|station)/, /কোথা\s*থেকে/], avoid: [/to\b/] },
    to: { must: [/\bto\b/, /destination/, /arrival\s*(city|airport|station)/, /কোথায়/], avoid: [/from/] },
    cabin: { must: [/class/, /cabin/], avoid: [] },
    baggage: { must: [/baggage/, /luggage/, /ব্যাগেজ/], avoid: [] }
  };

  /* ------------------------------------------------------------------ *
   * 2. একটি ইনপুটের "পরিচয় লেখা" বের করা
   * ------------------------------------------------------------------ */

  function textOf(node) {
    if (!node) return '';
    return (node.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function labelText(el) {
    var doc = el.ownerDocument;
    var bits = [];
    if (el.id) {
      var lab = doc.querySelector('label[for="' + cssEscape(el.id) + '"]');
      if (lab) bits.push(textOf(lab));
    }
    var wrapLabel = el.closest ? el.closest('label') : null;
    if (wrapLabel) bits.push(textOf(wrapLabel));

    // আশেপাশের label / small / span / div.label
    var holder = el.closest ? (el.closest('.field, .form-group, .input-group, .row, td, th, li, p, div')) : null;
    if (holder) {
      var inner = holder.querySelector('label, .label, small, b, strong, span');
      if (inner && !inner.contains(el)) bits.push(textOf(inner));
    }
    // টেবিল হলে কলাম হেডার
    var td = el.closest ? el.closest('td') : null;
    if (td && td.parentElement) {
      var row = td.parentElement, cells = Array.prototype.indexOf.call(row.children, td);
      var table = el.closest('table');
      if (table) {
        var headRow = table.querySelector('thead tr') || table.querySelector('tr');
        if (headRow && headRow !== row && headRow.children[cells]) bits.push(textOf(headRow.children[cells]));
      }
      if (row.children[0] && row.children[0] !== td) bits.push(textOf(row.children[0]));
    }
    // ঠিক আগের টেক্সট নোড/এলিমেন্ট
    var prev = el.previousElementSibling;
    if (prev && !/input|select|textarea|button/i.test(prev.tagName)) bits.push(textOf(prev));

    return bits.join(' ');
  }

  function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }

  function haystack(el) {
    return [
      el.id, el.name, el.getAttribute('placeholder'), el.getAttribute('aria-label'),
      el.getAttribute('data-field'), el.getAttribute('data-key'), el.getAttribute('title'),
      labelText(el)
    ].filter(Boolean).join(' ')
      .replace(/[_\-]+/g, ' ')
      .replace(/([a-z])([A-Z])/g, '$1 $2')   // camelCase -> "camel Case"
      .replace(/\s+/g, ' ')
      .toLowerCase();
  }

  /** "Flight No. 2", "date2", "seg-3-time" ইত্যাদি থেকে সেগমেন্ট নম্বর */
  function segIndexOf(hay) {
    var m = hay.match(/(?:^|[^0-9])([1-9])(?:[^0-9]|$)/g);
    if (!m) return null;
    var nums = hay.match(/\b(?:no\.?|number|#)?\s*([1-9])\b/g);
    var last = (nums && nums.length) ? nums[nums.length - 1].match(/([1-9])/)[1] : null;
    return last ? parseInt(last, 10) : null;
  }

  function score(hay, rule) {
    if (!hay) return 0;
    var i, s = 0, hit = false;
    for (i = 0; i < rule.must.length; i++) {
      if (rule.must[i].test(hay)) { hit = true; s += (rule.must.length - i) * 10; break; }
    }
    if (!hit) return 0;
    (rule.boost || []).forEach(function (r) { if (r.test(hay)) s += 5; });
    for (i = 0; i < (rule.avoid || []).length; i++) if (rule.avoid[i].test(hay)) return 0;
    return s;
  }

  /* ------------------------------------------------------------------ *
   * 3. ফিল্ড খোঁজা ও ভরা
   * ------------------------------------------------------------------ */

  function candidates(scope) {
    var doc = scope || (root && root.document);
    if (!doc) return [];
    var nodes = doc.querySelectorAll('input, textarea, select');
    return Array.prototype.filter.call(nodes, function (el) {
      var t = (el.type || 'text').toLowerCase();
      if (['hidden', 'file', 'submit', 'button', 'reset', 'image', 'checkbox', 'radio', 'range', 'color'].indexOf(t) >= 0) return false;
      if (el.disabled || el.readOnly) return false;
      // বিশাল textarea (পুরোনো "Imported Ticket Information" বক্স) এড়ানো
      if (el.tagName === 'TEXTAREA' && /imported|raw|extract|paste|ocr|আমদানি/i.test(haystack(el))) return false;
      return true;
    });
  }

  function setValue(el, value, opts) {
    if (!el || value == null || value === '') return false;
    if (!opts.overwrite && String(el.value || '').trim() !== '') return false;
    if (el.tagName === 'SELECT') {
      var want = String(value).toLowerCase(), done = false;
      Array.prototype.forEach.call(el.options, function (o) {
        if (!done && (o.value.toLowerCase() === want || o.text.toLowerCase().indexOf(want) >= 0)) { el.value = o.value; done = true; }
      });
      if (!done) return false;
    } else {
      el.value = String(value);
    }
    el.dispatchEvent(new (root.Event || function () {})('input', { bubbles: true }));
    el.dispatchEvent(new (root.Event || function () {})('change', { bubbles: true }));
    if (opts.highlight !== false && el.style) {
      var old = el.style.backgroundColor;
      el.style.transition = 'background-color .8s';
      el.style.backgroundColor = 'rgba(34,197,94,.28)';
      setTimeout(function () { el.style.backgroundColor = old || ''; }, 900);
    }
    return true;
  }

  /** ডেট-ইনপুট (type=date) হলে ISO লাগে */
  function valueFor(el, key, result, segment) {
    var v;
    if (segment) v = segment[key];
    else v = result[key];
    if (el.type === 'date') {
      if (segment && key === 'date') return segment.dateIso || isoFromText(v);
      if (!segment && /date/i.test(key)) return isoFromText(v);
    }
    if (el.type === 'time' && /time/i.test(key)) return v || '';
    if (el.type === 'number' && key === 'totalAmountText') return result.totalAmount != null ? result.totalAmount : '';
    return v;
  }

  function isoFromText(text) {
    if (!text) return '';
    var p = root.TicketParser && root.TicketParser.findDates ? root.TicketParser.findDates(String(text)) : [];
    return p.length ? p[0].date.iso : '';
  }

  /**
   * মূল কাজ: পার্স করা ফলাফল পেজের ফিল্ডে বসানো।
   * @param {string|object} textOrResult  OCR টেক্সট বা parseTicket()-এর ফলাফল
   * @param {object} [options] { scope, overwrite=true, highlight=true, map }
   * @returns {{result:object, filled:object, unmatched:string[]}}
   */
  function fill(textOrResult, options) {
    options = options || {};
    var opts = {
      overwrite: options.overwrite !== false,
      highlight: options.highlight !== false
    };
    var Parser = root.TicketParser || (typeof require === 'function' ? require('./ticket-parser.js') : null);
    if (!Parser) throw new Error('ticket-parser.js আগে লোড করুন।');

    var result = (typeof textOrResult === 'string') ? Parser.parseTicket(textOrResult) : textOrResult;
    var els = candidates(options.scope);
    var info = els.map(function (el) { return { el: el, hay: haystack(el), seg: null }; });
    var filled = {}, used = [];

    // 3a. ব্যবহারকারীর নিজের ম্যাপ (id/selector -> key) সবার আগে
    if (options.map) {
      Object.keys(options.map).forEach(function (sel) {
        var el = (options.scope || root.document).querySelector(sel);
        if (!el) return;
        var key = options.map[sel];
        if (setValue(el, deepGet(result, key), opts)) { filled[key] = true; used.push(el); }
      });
    }

    // 3b. সেগমেন্ট ফিল্ড (একই লেবেল একাধিকবার থাকলে ক্রম অনুযায়ী 1,2,3…)
    var segs = result.segments || [];
    Object.keys(SEGMENT_RULES).forEach(function (key) {
      var rule = SEGMENT_RULES[key];
      var matches = info.filter(function (x) {
        return used.indexOf(x.el) < 0 && score(x.hay, rule) > 0;
      });
      if (!matches.length) return;

      // যেগুলোতে স্পষ্ট নম্বর আছে ("Flight No. 2") সেগুলো আগে
      var numbered = matches.filter(function (x) { return segIndexOf(x.hay) != null; });
      var plain = matches.filter(function (x) { return segIndexOf(x.hay) == null; });

      numbered.forEach(function (x) {
        var i = segIndexOf(x.hay) - 1;
        if (segs[i] && setValue(x.el, valueFor(x.el, key, result, segs[i]), opts)) {
          filled['segment' + (i + 1) + '.' + key] = true; used.push(x.el);
        }
      });
      // নম্বর ছাড়া ফিল্ডগুলো ডকুমেন্ট-ক্রমে 1,2,3…
      plain.forEach(function (x, i) {
        if (segs[i] && setValue(x.el, valueFor(x.el, key, result, segs[i]), opts)) {
          filled['segment' + (i + 1) + '.' + key] = true; used.push(x.el);
        }
      });
    });

    // 3c. সাধারণ ফিল্ড — প্রতিটির জন্য সবচেয়ে ভালো ম্যাচ একটি ইনপুট
    Object.keys(FIELD_RULES).forEach(function (key) {
      if (filled[key]) return;
      var rule = FIELD_RULES[key], best = null, bestScore = 0;
      info.forEach(function (x) {
        if (used.indexOf(x.el) >= 0) return;
        var s = score(x.hay, rule);
        if (s > bestScore) { bestScore = s; best = x; }
      });
      if (best && setValue(best.el, valueFor(best.el, key, result, null), opts)) {
        filled[key] = true; used.push(best.el);
      }
    });

    var unmatched = Object.keys(FIELD_RULES).filter(function (k) { return result[k] && !filled[k]; });
    return { result: result, filled: filled, unmatched: unmatched, inputsFilled: used.length };
  }

  function deepGet(obj, path) {
    return String(path).split('.').reduce(function (o, k) {
      if (o == null) return '';
      if (/^\d+$/.test(k)) return o[+k];
      return o[k];
    }, obj);
  }

  /* ------------------------------------------------------------------ *
   * 4. ফাইল ইনপুট যুক্ত করা (PDF text layer / OCR)
   * ------------------------------------------------------------------ */

  function extractText(file) {
    var isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    if (isPdf && root.pdfjsLib) {
      return file.arrayBuffer()
        .then(function (buf) { return root.pdfjsLib.getDocument({ data: buf }).promise; })
        .then(function (pdf) {
          var chain = Promise.resolve(), pages = [];
          for (var i = 1; i <= pdf.numPages; i++) {
            (function (n) {
              chain = chain.then(function () {
                return pdf.getPage(n)
                  .then(function (p) { return p.getTextContent(); })
                  .then(function (tc) { pages.push(linesFromItems(tc.items)); });
              });
            })(i);
          }
          return chain.then(function () { return pages.join('\n'); });
        });
    }
    if (root.Tesseract) {
      return root.Tesseract.recognize(file, 'eng').then(function (r) { return r.data.text; });
    }
    return Promise.reject(new Error('PDF/OCR লাইব্রেরি নেই — pdf.js বা tesseract.js যোগ করুন।'));
  }

  function linesFromItems(items) {
    var rows = [];
    items.forEach(function (it) {
      if (!it.str || !it.str.trim()) return;
      var y = Math.round(it.transform[5]), row = null;
      for (var i = 0; i < rows.length; i++) if (Math.abs(rows[i].y - y) <= 3) { row = rows[i]; break; }
      if (!row) { row = { y: y, parts: [] }; rows.push(row); }
      row.parts.push({ x: it.transform[4], str: it.str });
    });
    rows.sort(function (a, b) { return b.y - a.y; });
    return rows.map(function (r) {
      r.parts.sort(function (a, b) { return a.x - b.x; });
      return r.parts.map(function (p) { return p.str; }).join(' ').replace(/\s+/g, ' ').trim();
    }).filter(Boolean).join('\n');
  }

  /** ফাইল ইনপুটে ফাইল দিলেই নিজে নিজে ফিল্ড ভরবে। */
  function attach(input, options) {
    options = options || {};
    if (!input) return;
    input.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (options.onStart) options.onStart(file);
      extractText(file).then(function (text) {
        var out = fill(text, options);
        if (options.onFill) options.onFill(out);
      }).catch(function (err) {
        if (options.onError) options.onError(err); else console.error(err);
      });
    });
  }

  /**
   * কোনো কোড না বদলেই পুরো পেজে প্যাচ বসায়:
   *  1) প্রতিটি PDF/ছবির file input-এ নিজে থেকে যুক্ত হয়
   *  2) পুরোনো "Imported Ticket Information" জাতীয় বড় textarea-তে লেখা এলেই
   *     সেটা পার্স করে ফিল্ড ভরে দেয় (আলাদা Apply চাপতে হয় না)
   *  3) চাইলে ঐ raw বক্সটা আড়ালও করে দেয় (hideRawBox: true)
   */
  function autowire(options) {
    options = options || {};
    var doc = options.document || (root && root.document);
    if (!doc) return { fileInputs: 0, textAreas: 0 };

    var fileInputs = Array.prototype.filter.call(doc.querySelectorAll('input[type=file]'), function (el) {
      var a = (el.getAttribute('accept') || '').toLowerCase();
      return !a || /pdf|image|\.png|\.jpg|\.jpeg|\.webp/.test(a);
    });
    fileInputs.forEach(function (el) {
      if (el.__ticketAutoFill) return;
      el.__ticketAutoFill = true;
      attach(el, options);
    });

    var areas = Array.prototype.filter.call(doc.querySelectorAll('textarea'), function (t) {
      return /import|raw|ocr|extract|ticket|paste|scan|তথ্য|লেখা/i.test(haystack(t));
    });
    areas.forEach(function (t) {
      if (t.__ticketAutoFill) return;
      t.__ticketAutoFill = true;
      var last = '';
      var run = function () {
        var v = t.value || '';
        if (v.length < 60 || v === last) return;
        last = v;
        var out = fill(v, options);
        if (options.onFill) options.onFill(out);
      };
      t.addEventListener('input', run);
      t.addEventListener('change', run);
      t.addEventListener('blur', run);
      if (options.poll !== false && root.setInterval) root.setInterval(run, 900);
      run();
      if (options.hideRawBox) {
        var box = t.closest ? (t.closest('.field, .form-group, label, div') || t) : t;
        if (box.style) box.style.display = 'none';
      }
    });

    return { fileInputs: fileInputs.length, textAreas: areas.length };
  }

  return {
    fill: fill,
    attach: attach,
    autowire: autowire,
    extractText: extractText,
    // ডিবাগ/কাস্টমাইজের জন্য
    haystack: haystack,
    FIELD_RULES: FIELD_RULES,
    SEGMENT_RULES: SEGMENT_RULES
  };
});

</script>
<script>
(function () {
  if (window.pdfjsLib && !pdfjsLib.GlobalWorkerOptions.workerSrc) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }

  /* ======================= CONFIG — দরকার হলে বদলান ======================= */
  var CONFIG = {
    // hideRawBox: true দিলে পুরোনো বড় "Imported Ticket Information" বক্সটা লুকিয়ে যাবে
    hideRawBox: false,

    // overwrite: false দিলে হাতে লেখা মান মুছে যাবে না
    overwrite: true,

    // কোনো তথ্য ভুল ঘরে গেলে এখানে নিজে ম্যাপ করুন (selector → key)
    map: {
      // '#travelDate':  'travelDate',
      // '#flightNo1':   'segments.0.flightNo',
      // '#route1':      'segments.0.route',
      // '#flightNo2':   'segments.1.flightNo',
      // '#totalAmount': 'totalAmountText'
    },

    onFill: function (r) {
      console.log('[AutoFill] ' + r.inputsFilled + ' টি ফিল্ড ভরা হয়েছে', r.result);
      if (r.unmatched.length) console.warn('[AutoFill] ফর্মে ঘর পাওয়া যায়নি:', r.unmatched);
    },
    onError: function (e) { console.error('[AutoFill]', e); alert('টিকিট পড়া যায়নি: ' + e.message); }
  };
  /* ====================================================================== */

  function go() {
    var r = TicketAutoFill.autowire(CONFIG);
    console.log('[AutoFill] ready — ' + r.fileInputs + ' file input, ' + r.textAreas + ' raw box');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();

  // নিজের কোড থেকে ডাকতে চাইলে:  TicketAutoFill.fill(ocrText, CONFIG);
  window.__autoFillConfig = CONFIG;
})();
</script>
